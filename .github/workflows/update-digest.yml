name: Update Daily Digest

on:
  schedule:
    # Run daily at 13:00 PM UTC (adjust to your preferred time)
    - cron: '0 13 * * *'
  
  # Allow manual trigger from Actions tab
  workflow_dispatch:

# IMPORTANT: Grant permissions for the workflow to push commits
permissions:
  contents: write  # Allows pushing commits back to the repository

jobs:
  update-digest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Verify configuration files
        run: |
          echo "Checking for required files..."
          if [ ! -f config.yaml ]; then
            echo "❌ Error: config.yaml not found"
            exit 1
          fi
          echo "✅ Configuration files verified"
      
      - name: Run tests
        run: |
          pip install -r requirements-dev.txt
          pytest --tb=short --cov=src --cov-report=term-missing
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          WORDNIK_API_KEY: ${{ secrets.WORDNIK_API_KEY }}
        continue-on-error: false  # Fail workflow if tests fail
      
      - name: Generate Daily Digest
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          WORDNIK_API_KEY: ${{ secrets.WORDNIK_API_KEY }}
        run: |
          echo "Generating daily digest..."
          python -m src
          echo "✅ Digest generation completed"
      
      - name: Verify output file
        run: |
          if [ ! -f index.html ]; then
            echo "❌ Error: index.html was not generated"
            echo "Checking for alternative output filenames..."
            ls -la *.html || echo "No HTML files found"
            exit 1
          fi
          echo "✅ index.html generated successfully"
          echo "File size: $(du -h index.html | cut -f1)"
      
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add index.html
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit - digest content unchanged"
          else
            git commit -m "🤖 Update digest - $(date +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ Changes committed and pushed"
          fi
      
      - name: Upload digest as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-${{ github.run_number }}
          path: index.html
          retention-days: 7
      
      - name: Workflow summary
        if: always()
        run: |
          echo "## Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f index.html ]; then
            echo "✅ Digest generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "📊 File size: $(du -h index.html | cut -f1)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Digest generation failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🕐 Completed at: $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY